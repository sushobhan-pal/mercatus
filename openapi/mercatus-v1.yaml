        -
          cookieNonce: []
        -
          applicationPassword: []
      x-mercatus-access: admin
      x-mercatus-resource: cache_group
components:
  schemas:
    Error:
      type: object
      description: 'Error envelope (API-1).'
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 'Machine-readable code; mercatus_* for Mercatus errors.'
        message:
          type: string
        details:
          type: object
        request_id:
          type: string
          description: 'req_* identifier to quote in support requests and logs.'
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    cookieNonce:
      type: apiKey
