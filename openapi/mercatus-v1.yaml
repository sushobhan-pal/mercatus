          name: id
          in: path
          required: true
          description: 'Module ID.'
          schema:
            type: string
      responses:
        2XX:
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  active:
                    type: boolean
                required:
                  - id
                  - active
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
