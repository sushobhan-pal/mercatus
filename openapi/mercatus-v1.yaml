components:
  schemas:
    Error:
      type: object
      description: 'Error envelope (API-1).'
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 'Machine-readable code; mercatus_* for Mercatus errors.'
        message:
          type: string
        details:
          type: object
        request_id:
          type: string
          description: 'req_* identifier to quote in support requests and logs.'
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    cookieNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: 'WordPress login cookie plus a wp_rest nonce.'
    applicationPassword:
      type: http
      scheme: basic
      description: 'WordPress application password.'
