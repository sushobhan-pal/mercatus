                        code:
                          type: string
                        details:
                          type: object
                      required:
                        - id
                        - status
                        - code
                        - details
                required:
                  - status
                  - checks
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      security:
        -
          cookieNonce: []
        -
          applicationPassword: []
      x-mercatus-access: admin
      x-mercatus-resource: health
  /modules:
    get:
      operationId: getModules
      summary: 'Optional modules and their state'
      tags:
        - modules
      responses:
        2XX:
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        version:
                          type: string
                        active:
                          type: boolean
                      required:
