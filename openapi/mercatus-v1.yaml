    get:
      operationId: getFeatures
      summary: 'Active modules and their features'
      tags:
        - features
      responses:
        2XX:
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        version:
                          type: string
                      required:
                        - id
                  features:
                    type: array
                    items:
                      type: string
                required:
                  - modules
                  - features
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      security: []
      x-mercatus-access: public
      x-mercatus-resource: feature
  /health:
    get:
      operationId: getHealth
      summary: 'Health report'
      tags:
        - health
      responses:
        2XX:
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - warning
                      - error
                  checks:
                    type: array
                    items:
